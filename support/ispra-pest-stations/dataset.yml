root: "../../out"
schema_version: 1

dataset:
  name: "ispra_pest_stations"
  source_id: "ispra_linked_data"
  tags: [anagrafica, ispra, pesticidi, stazioni]
  category: support
  description: "Anagrafica stazioni pesticidi ISPRA con coordinate geografiche (2018-2021). ~4-5K stazioni/anno."
  years: [2021]

raw:
  sources:
    - name: "ispra_pest_stations_sparql"
      type: "script"
      args:
        command: "python scripts/fetch_stations.py raw_input.csv"
        output: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, station_id, lat, lon]
  read:
    source: auto
    mode: latest
    strict_mode: false
  validate:
    not_null: [station_id, lat, lon]
    min_rows: 3000

mart:
  tables:
    - name: "mart_stations"
      sql: "sql/mart_stations.sql"
  required_tables:
    - "mart_stations"
  validate:
    table_rules:
      mart_stations:
        required_columns: [anno, station_id, lat, lon]
        primary_key: [station_id, anno]
        min_rows: 3000

validation:
  fail_on_error: true
