root: "../../out"
schema_version: 1

dataset:
  name: "ispra_rmn"
  source_id: "ispra_linked_data"
  tags: [ambiente, ispra, mare, livello, maree, clima]
  category: ambiente
  description: "Rete Mareografica Nazionale — livelli marini da 36 stazioni costiere italiane (2010-2023). Dati orari da boe e st fisse."
  years: [2023]

raw:
  sources:
    - name: "ispra_rmn_fetch"
      type: "script"
      client:
        timeout: 900
      args:
        command: "python scripts/fetch_rmn.py raw_input.csv"
        output: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [station_id, anno, mese, timestamp_utc, livello]
  read:
    source: auto
    mode: latest
    strict_mode: false
    columns:
      station_id: VARCHAR
      year: VARCHAR
      month: VARCHAR
      timestamp_utc: VARCHAR
      level: VARCHAR
  validate:
    not_null: [station_id, anno]
    min_rows: 1000000

mart:
  tables:
    - name: "mart_stazioni"
      sql: "sql/mart_stazioni.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
  required_tables:
    - "mart_stazioni"
    - "mart_sintesi"
  validate:
    table_rules:
      mart_stazioni:
        min_rows: 30
      mart_sintesi:
        min_rows: 10

validation:
  fail_on_error: true
