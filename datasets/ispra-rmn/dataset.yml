root: "../../out"
schema_version: 1

dataset:
  name: "ispra_rmn"
  source_id: "ispra_linked_data"
  tags: [ambiente, ispra, mare, livello, maree, clima]
  category: ambiente
  description: "Rete Mareografica Nazionale — livelli marini da 36 stazioni costiere italiane (2010-2023). Dati orari da boe e st fisse."
  years: [2023]
  # Copertura reale del clean pubblicato: 2010-2022.
  # (La description dice 2010-2023: da riverificare quando il fetch verra'
  #  reso eseguibile — vedi issue #4 sul client timeout.)
  time_coverage: {start_year: 2010, end_year: 2022}

raw:
  sources:
    - name: "ispra_rmn_fetch"
      type: "script"
      client:
        # Il fetch scarica ~30K CSV: ~11-15 min, variabile col carico. A 900s
        # andava in timeout a intermittenza (run #9 rosso, run 2026-11-01 ok).
        # 1800s = 2x headroom. Ottimizzazione incrementale/parallela: issue #4.
        timeout: 1800
      args:
        command: "python scripts/fetch_rmn.py raw_input.csv"
        output: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [station_id, anno, mese, timestamp_utc, livello]
  read:
    source: auto
    mode: latest
    strict_mode: false
    columns:
      station_id: VARCHAR
      year: VARCHAR
      month: VARCHAR
      timestamp_utc: VARCHAR
      level: VARCHAR
  validate:
    not_null: [station_id, anno]
    min_rows: 1000000

mart:
  tables:
    - name: "mart_stazioni"
      sql: "sql/mart_stazioni.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
  required_tables:
    - "mart_stazioni"
    - "mart_sintesi"
  validate:
    table_rules:
      mart_stazioni:
        min_rows: 30
      mart_sintesi:
        min_rows: 10

validation:
  fail_on_error: true
