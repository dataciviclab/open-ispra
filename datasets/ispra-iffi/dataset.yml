root: "../../out"
schema_version: 1

dataset:
  name: "ispra_iffi"
  source_id: "ispra"
  tags: [ambiente, ispra, frane, dissesto, idrogeologico]
  category: ambiente
  description: "Inventario dei Fenomeni Franosi in Italia (IFFI). Statistiche frane per regione e provincia da IdroGEO API."
  years: [2024]

raw:
  sources:
    - name: "ispra_iffi_api"
      type: "script"
      args:
        command: "python scripts/fetch_iffi.py raw_input.csv"
        output: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [regione, nr_frane]
  validate:
    not_null: [regione]
    min_rows: 20

mart:
  tables:
    - name: "mart_italia"
      sql: "sql/mart_italia.sql"
    - name: "mart_regioni"
      sql: "sql/mart_regioni.sql"
  required_tables:
    - "mart_italia"
    - "mart_regioni"
  validate:
    table_rules:
      mart_italia:
        min_rows: 1
      mart_regioni:
        min_rows: 20

validation:
  fail_on_error: true
