root: "../../out"
schema_version: 1

dataset:
  name: "ispra_pest"
  source_id: "ispra_linked_data"
  tags: [ambiente, ispra, pesticidi, acque, inquinamento]
  category: ambiente
  description: "Concentrazioni pesticidi nelle acque sotterranee in Italia (2018-2021). ~3M misurazioni/anno per sostanza CAS."
  years: [2021]
  # Anno nominale: lo script recupera tutti gli anni (2018-2021) in un singolo CSV.

raw:
  sources:
    - name: "ispra_pest_indicators"
      type: "script"
      client:
        timeout: 3600
      args:
        command: "python scripts/fetch_indicators.py raw_input.csv"
        output: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, station_id, cas_number, valore]
  read:
    source: auto
    mode: latest
    strict_mode: false
    columns:
      year: VARCHAR
      station_id: VARCHAR
      cas_number: VARCHAR
      identifier: VARCHAR
      value: VARCHAR
      uom: VARCHAR
  validate:
    not_null: [anno, station_id, cas_number]
    min_rows: 1000000

mart:
  tables:
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
  required_tables:
    - "mart_sintesi"
  validate:
    table_rules:
      mart_sintesi:
        min_rows: 1

validation:
  fail_on_error: true
