root: "../../out"
schema_version: 1

dataset:
  name: "ispra_consumo_suolo"
  source_id: "ispra"
  tags: [ambiente, ispra, consumo, suolo]
  category: ambiente
  years: [ 2025 ]
  # Anno nominale: il file XLSX copre l'intera serie 2006-2025.
  # Non esistono file separati per anno: year=2025 e` il rilascio piu recente.
  # Output in formato long: una riga per comune x periodo (12 periodi).

raw:
  sources:
    - name: "ispra_consumo_suolo_xlsx"
      type: "http_file"
      args:
        # Rilascio 2026 (serie 2006-2025), pubblicato sul canale SNPA.
        # Il vecchio "estratto_dati" su isprambiente.gov.it si ferma al 2024.
        url: "https://www.snpambiente.it/wp-content/uploads/2026/10/consumo_suolo_2026_dati_principali-1.xlsx"
        filename: "ispra_consumo_suolo_{year}.xlsx"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [pro_com, comune, provincia, regione, periodo, anno]
  read:
    source: auto
    mode: latest
    sheet_name: "Comuni_2006_2025"
    # La riga 0 e` header (nomi colonne originali ISPRA). Nel rilascio 2026 non
    # c'e` riga di unita` misura; eventuali righe non-comune sono scartate dal
    # filtro PRO_COM in clean.sql.
  validate:
    not_null: [anno]
    min_rows: 70000
    # ~7.896 comuni x 12 periodi = ~94.752 righe in formato long

mart:
  tables:
    # Arricchimento comunale + benchmark consumo suolo
    - name: "mart_comuni"
      sql: "sql/mart_comuni.sql"
    # Trend per livello (nazionale/regione/provincia) × anno
    # Unifica i vecchi 3 trend separati
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
  required_tables:
    - "mart_comuni"
    - "mart_sintesi"
  validate:
    table_rules:
      mart_comuni:
        min_rows: 70000
      mart_sintesi:
        min_rows: 500

validation:
  fail_on_error: true
