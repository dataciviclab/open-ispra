root: "../../out"
schema_version: 1

dataset:
  name: "ispra_urban"
  source_id: "ispra_linked_data"
  tags: [ambiente, ispra, qualita-urbana, comuni]
  category: ambiente
  description: "Qualità ambientale urbana in Italia. Indicatori ambientali per comune da linked.isprambiente.it. Dati per ~600 comuni capoluogo."
  years: [2018]
  # Anno nominale: il graph SPARQL contiene la serie 1970-2019.
  # year=2018 è il graph più recente. Per anni precedenti, cambiare il graph nella query.

raw:
  sources:
    - name: "ispra_urban_sparql"
      type: "sparql"
      client:
        timeout: 180
      args:
        endpoint: "https://dati.isprambiente.it/sparql"
        query: |
          PREFIX top: <https://w3id.org/italia/env/onto/top/>
          SELECT ?uri ?label ?value ?uom WHERE {
            GRAPH <https://w3id.org/italia/env/ld/urban/2018/> {
              ?uri rdfs:label ?label .
              ?uri top:hasValue ?vn .
              ?vn top:value ?value .
              ?vn top:hasUnitOfMeasure ?uom .
              FILTER(lang(?label) = 'it')
            }
          }
        accept_format: "sparql-results+json"
        pages: 10
        step: 5000
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [codice_istat, indicatore, anno, valore, unita_misura]
  validate:
    not_null: [codice_istat, indicatore, anno]
    min_rows: 10000

mart:
  tables:
    - name: "mart_comuni"
      sql: "sql/mart_comuni.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
  required_tables:
    - "mart_comuni"
    - "mart_sintesi"
  validate:
    table_rules:
      mart_comuni:
        required_columns: [codice_istat, anno, totale_indicatori]
        primary_key: [codice_istat, anno]
        min_rows: 100
      mart_sintesi:
        required_columns: [anno, totale_comuni, totale_indicatori]
        primary_key: [anno]
        min_rows: 1

validation:
  fail_on_error: true
