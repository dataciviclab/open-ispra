root: "../../out"
schema_version: 1

dataset:
  name: "ispra_urban"
  source_id: "ispra_linked_data"
  tags: [ambiente, ispra, qualita-urbana, comuni]
  category: ambiente
  description: "Qualita ambientale urbana in Italia (1970-2019). Indicatori ambientali per comune da linked.isprambiente.it. 27 anni, ~245-600 comuni."
  years: [2018]
  # Anno nominale: lo script recupera TUTTI gli anni disponibili in un singolo CSV.
  # year=2018 e il nome del run, non limita i dati scaricati.

raw:
  sources:
    - name: "ispra_urban_sparql_all"
      type: "script"
      args:
        command: "python scripts/fetch_urban.py raw_input.csv"
        output: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    strict_mode: false
    columns:
      uri: VARCHAR
      label: VARCHAR
      value: VARCHAR
      uom: VARCHAR
      year: VARCHAR
  required_columns: [codice_istat, indicatore, anno, valore, unita_misura]
  validate:
    not_null: [codice_istat, indicatore, anno]
    min_rows: 50000

mart:
  tables:
    - name: "mart_comuni"
      sql: "sql/mart_comuni.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
  required_tables:
    - "mart_comuni"
    - "mart_sintesi"
  validate:
    table_rules:
      mart_comuni:
        required_columns: [codice_istat, anno, totale_indicatori]
        primary_key: [codice_istat, anno]
        min_rows: 1000
      mart_sintesi:
        required_columns: [anno, totale_comuni, totale_indicatori]
        primary_key: [anno]
        min_rows: 20

validation:
  fail_on_error: true
