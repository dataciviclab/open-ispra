root: "../../out"
schema_version: 1

dataset:
  name: "ispra_bathw"
  source_id: "ispra_linked_data"
  tags: [ambiente, ispra, balneazione, acqua, qualita]
  category: ambiente
  description: "Qualita acque di balneazione in Italia (1990-2024). Dati SPARQL da linked.isprambiente.it. 35 anni di serie storica, ~5.500 siti/anno."
  years: [2024]
  # Anno nominale: lo script recupera TUTTI gli anni (1990-2024) in un singolo CSV.
  # year=2024 e il nome del run, non limita i dati scaricati.

raw:
  sources:
    - name: "ispra_bathw_sparql_all"
      type: "script"
      args:
        command: "python scripts/fetch_bathw.py raw_input.csv"
        output: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [codice_sito, indicatore, anno, valore, unita_misura]
  validate:
    not_null: [codice_sito, indicatore, anno]
    min_rows: 100000

mart:
  tables:
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
    - name: "mart_sintesi_anno"
      sql: "sql/mart_sintesi_anno.sql"
  required_tables:
    - "mart_sintesi"
    - "mart_sintesi_anno"
  validate:
    table_rules:
      mart_sintesi:
        required_columns: [anno, totale_siti, eccellente, buona, sufficiente, scadente]
        primary_key: [anno]
        min_rows: 30
      mart_sintesi_anno:
        required_columns: [anno, totale_siti, eccellente, buona, sufficiente, scadente]
        primary_key: [anno]
        min_rows: 30

validation:
  fail_on_error: true
